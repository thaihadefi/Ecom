# nginx (public reverse proxy) -> web -> filemanager (internal only). No MongoDB service:
# DATABASE in Web/.env points at MongoDB Atlas, same as local dev.
#
# Setup: cp Web/.env.example Web/.env && cp FileManager/.env.example FileManager/.env, fill
# both in (FILE_MANAGER_SECRET must match in both), then `docker compose up -d --build`.
services:
  web:
    build:
      context: ./Web
    env_file:
      - ./Web/.env
    environment:
      TRUST_PROXY: "1"
      NODE_ENV: "production"
      FILE_MANAGER_URL: "http://filemanager:4000"
    depends_on:
      filemanager:
        condition: service_healthy
    restart: unless-stopped
    # Matches the app's own 10 s graceful-shutdown timeout, so open requests can finish on redeploy.
    stop_grace_period: 15s
    networks:
      - ecom
    volumes:
      - ./Web/public:/app/public
      - ./Web/views:/app/views
    healthcheck:
      # TCP connect, not an HTTP request: some routes return non-2xx by design, and "localhost"
      # can resolve to the IPv6 loopback the app doesn't listen on in this image.
      test: ["CMD", "node", "-e", "require('net').createConnection(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  filemanager:
    build:
      context: ./FileManager
    env_file:
      - ./FileManager/.env
    environment:
      TRUST_PROXY: "1"
      NODE_ENV: "production"
    restart: unless-stopped
    networks:
      - ecom
    volumes:
      - ./FileManager/media:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(4000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No ports: published; only web reaches it, over the ecom network.

  nginx:
    image: nginx:alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      # Directory mount, not a single file: editors replace files on save, which leaves a
      # single-file bind mount pointing at the old, deleted copy. nginx loads conf.d/*.conf.
      - ./nginx:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks:
      - ecom

networks:
  ecom:
    driver: bridge
