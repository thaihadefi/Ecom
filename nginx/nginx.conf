# Load-balancing reverse proxy over web1/web2. FileManager has no published port and is never
# proxied here (see docker-compose.yml).
#
# TLS once you have a domain: certbot --nginx -d your-domain.com

upstream web_app {
    # ip_hash: sticky sessions, since Socket.IO has no shared adapter across replicas.
    ip_hash;
    server web1:3000;
    server web2:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    location /socket.io/ {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
