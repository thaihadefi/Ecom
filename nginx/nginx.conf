# Reverse proxy in front of the web app. FileManager has no published port and is never proxied
# here (see docker-compose.yml).
#
# TLS once you have a domain: certbot --nginx -d your-domain.com

# Docker's embedded DNS. With `resolve` below, nginx re-resolves "web" when the container is
# recreated (new IP) instead of proxying to the old address until nginx itself restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_app {
    zone web_app 64k;
    server web:3000 resolve;
}

# Keep the scheme reported by a TLS-terminating proxy in front of nginx (e.g. ngrok), so the app
# sees HTTPS requests as secure and marks cookies Secure. Without such a proxy, use nginx's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Socket.IO needs "Connection: upgrade" only when the client asks for a WebSocket upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    proxy_http_version 1.1;
    # $http_host keeps the port (e.g. localhost:3000); $host would drop it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /socket.io/ {
        proxy_pass http://web_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://web_app;
        proxy_set_header Connection "";
    }
}
